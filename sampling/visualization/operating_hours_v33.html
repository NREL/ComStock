const SVG_NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent = null) => {

  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);

const key = (v) => Math.round(v * 1e4) / 1e4;
const sum = (a) => a.reduce((s, v) => s + v, 0);

function fmtHour(h) {
  const days = Math.floor(h / 24);
  const rem = h - days * 24;
  let hr = Math.floor(rem + 1e-9);
  const min = Math.round((rem - hr) * 60);
  const ampm = hr < 12 ? 'AM' : 'PM';
  let h12 = hr % 12; if (h12 === 0) h12 = 12;
  return `${h12}:${String(min).padStart(2, '0')} ${ampm}${days > 0 ? ' +1d' : ''}`;
}

/** Weighted mean and percentiles of a discrete distribution. */
function stats(values, weights) {
  const total = sum(weights);
  if (total <= 0) return null;
  let mean = 0;
  for (let i = 0; i < values.length; i++) mean += values[i] * weights[i];
  mean /= total;
  const pct = (q) => {
    let acc = 0;
    for (let i = 0; i < values.length; i++) {
      acc += weights[i] / total;
      if (acc >= q - 1e-12) return values[i];
    }
    return values[values.length - 1];
  };
  return { mean, p10: pct(0.10), p50: pct(0.50), p90: pct(0.90) };
}

/** Gaussian KDE of a weighted discrete sample, evaluated on grid. */
function kde(grid, values, weights, bw) {
  const out = new Float64Array(grid.length);
  const norm = 1 / (bw * Math.sqrt(2 * Math.PI));
  for (let i = 0; i < values.length; i++) {
    const w = weights[i];
    if (w <= 0) continue;
    for (let g = 0; g < grid.length; g++) {
      const z = (grid[g] - values[i]) / bw;
      if (z > 5 || z < -5) continue;
      out[g] += w * norm * Math.exp(-0.5 * z * z);
    }
  }
  return out;
}

function niceTickStep(span, target) {
  const raw = span / target;
  for (const s of [0.25, 0.5, 1, 2, 3, 4, 6, 12, 24]) if (raw <= s) return s;
  return 24;
}

/* -------------------------------------------------- distribution assembly */
/** Precompute the end-time grid and index lookup for a day type. */
function endGrid(dayType) {
  if (dayType._endGrid) return dayType._endGrid;
  const vals = new Set();
  for (const s of dayType.start_times) for (const d of dayType.durations) vals.add(key(s + d));
  const grid = [...vals].sort((a, b) => a - b);
  const index = new Map(grid.map((v, i) => [v, i]));
  dayType._endGrid = { grid, index };
  return dayType._endGrid;
}

/** End-time pmf conditional on a single start-time index (renormalized to 1). */
function endPmfForStart(dayType, btIdx, startIdx) {
  const { grid, index } = endGrid(dayType);
  const w = new Array(grid.length).fill(0);
  const durPmf = dayType.dur_pmf[btIdx][startIdx];
  const start = dayType.start_times[startIdx];
  for (let d = 0; d < dayType.durations.length; d++) {
    if (durPmf[d] <= 0) continue;
    w[index.get(key(start + dayType.durations[d]))] += durPmf[d];
  }
  return w;
}

/**
 * Start-weighted mixture of the conditional end-time pmfs.
 * A few start times in the source TSVs carry probability but have an all-zero duration
 * row; that mass cannot be placed on the end-time axis, so it is excluded here and
 * reported back to the caller as `dropped`.
 */
function endPmfTotal(dayType, btIdx) {
  const { grid } = endGrid(dayType);
  const w = new Array(grid.length).fill(0);
  const startPmf = dayType.start_pmf[btIdx];
  let covered = 0, dropped = 0;
  for (let s = 0; s < startPmf.length; s++) {
    if (startPmf[s] <= 0) continue;
    const cond = endPmfForStart(dayType, btIdx, s);
    if (sum(cond) <= 0) { dropped += startPmf[s]; continue; }
    covered += startPmf[s];
    for (let i = 0; i < w.length; i++) w[i] += startPmf[s] * cond[i];
  }
  if (covered > 0) for (let i = 0; i < w.length; i++) w[i] /= covered;
  return { weights: w, dropped };
}

/** Duration pmf for a building type, marginalized over start time. */
function durationPmfTotal(dayType, btIdx) {
  const startPmf = dayType.start_pmf[btIdx];
  const w = new Array(dayType.durations.length).fill(0);
  let covered = 0;
  for (let s = 0; s < startPmf.length; s++) {
    if (startPmf[s] <= 0) continue;
    const cond = dayType.dur_pmf[btIdx][s];
    if (sum(cond) <= 0) continue;
    covered += startPmf[s];
    for (let d = 0; d < w.length; d++) w[d] += startPmf[s] * cond[d];
  }
  if (covered > 0) for (let d = 0; d < w.length; d++) w[d] /= covered;
  return w;
}

/** Inclusive index range over which any of the weight arrays is non-negligible. */
function support(weightArrays, eps = 1e-9) {
  let lo = Infinity, hi = -Infinity;
  for (const w of weightArrays) {
    for (let i = 0; i < w.length; i++) {
      if (w[i] > eps) { if (i < lo) lo = i; if (i > hi) hi = i; }
    }
  }
  return lo > hi ? null : [lo, hi];
}

  }

  // bars
  const barW = Math.max(1.5, (PW / ((x1 - x0) / step)) * 0.82);
  const gBars = el('g', {}, svg);
  const bars = [];
  for (let i = 0; i < values.length; i++) {
    const w = weights[i];
    const highlighted = spec.highlightIndex === i;
    const r = el('rect', {
      x: xs(values[i]) - barW / 2,
      y: ys(w),
      width: barW,
      height: Math.max(0, M.t + PH - ys(w)),
      fill: highlighted ? 'var(--accent)' : accent,
      opacity: spec.highlightIndex == null || highlighted ? 1 : 0.32,
      rx: 1,
      class: 'bar'
    }, gBars);
    bars.push(r);
  }

  // KDE overlay
  if (kdeVals) {
    let d = '';
    for (let i = 0; i < kdeGrid.length; i++) d += `${i ? 'L' : 'M'}${xs(kdeGrid[i])},${ys(kdeVals[i])}`;
    el('path', { d, class: 'kde-line' }, svg);
    const lg = el('g', { class: 'legend' }, svg);
    el('line', { x1: M.l + PW - 96, x2: M.l + PW - 76, y1: M.t + 6, y2: M.t + 6, class: 'kde-line' }, lg);
    el('text', { x: M.l + PW - 72, y: M.t + 9.5 }, lg).textContent = 'gaussian KDE';
  }

  // hover interaction
  if (spec.onHover) {
    const gHover = el('g', {}, svg);
    if (spec.highlightIndex != null) {
      const i = spec.highlightIndex;
      const x = xs(values[i]);
      el('line', { x1: x, x2: x, y1: M.t, y2: M.t + PH, class: 'guide' }, gHover);
      const label = `${fmtHour(values[i])} — ${fmtPct(weights[i])}`;
      const tw = label.length * 6.1 + 14;
      const tx = Math.min(Math.max(x - tw / 2, M.l), M.l + PW - tw);
      el('rect', { x: tx, y: M.t + 2, width: tw, height: 19, rx: 3, class: 'callout-bg' }, gHover);
      el('text', { x: tx + tw / 2, y: M.t + 15.5, 'text-anchor': 'middle', class: 'callout' }, gHover)
        .textContent = label;
      if (spec.pinned) {
        el('text', { x: M.l, y: M.t + 15.5, class: 'pin-flag' }, gHover).textContent = 'PINNED';
      }
    }
    const hit = el('rect', {
      x: M.l, y: M.t, width: PW, height: PH, class: 'hitbox'
    }, svg);
    const idxFromEvent = (evt) => {
      const box = svg.getBoundingClientRect();
      const vx = ((evt.clientX - box.left) / box.width) * W;
      const val = x0 + ((vx - M.l) / PW) * (x1 - x0);
      let best = null, bestD = Infinity;
      for (let i = 0; i < values.length; i++) {
        if (weights[i] <= 0) continue;
        const d = Math.abs(values[i] - val);
        if (d < bestD) { bestD = d; best = i; }
      }
      return bestD <= step * 1.5 ? best : null;
    };
    hit.addEventListener('mousemove', (e) => spec.onHover(idxFromEvent(e), false));
    hit.addEventListener('mouseleave', () => spec.onHover(null, false));
    hit.addEventListener('click', (e) => spec.onHover(idxFromEvent(e), true));
  }
}

/* --------------------------------------------------------------- app state */
const state = {
  btIdx: 0,
  bandwidth: 0.5,
  showKde: true,
  rows: {},          // dayType -> {hover, pinned, nodes}
  activeRow: null,
};

const btSelect = document.getElementById('bt');
DATA.building_types.forEach((bt, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = titleCase(bt);
  btSelect.appendChild(o);
});
const defaultBt = DATA.building_types.indexOf('medium_office');
state.btIdx = defaultBt >= 0 ? defaultBt : 0;
btSelect.value = state.btIdx;

document.getElementById('subtitle').innerHTML =
  `Start-time and end-time probability distributions sampled by ComStock, from ` +
  `<code>${DATA.source}</code>. End time = start time + duration; the end-time distribution is the ` +
  `start-weighted mixture over all start times. Generated ${DATA.generated}.`;

const rowsEl = document.getElementById('rows');
for (const dayType of Object.keys(DATA.day_types)) {
  const section = document.createElement('div');
  section.className = 'row';
  const color = dayType === 'weekend' ? 'var(--weekend)' : 'var(--weekday)';
  section.innerHTML = `
    <div class="row-title">
      <span class="swatch" style="background:${color}"></span>${dayType}
      <span class="note" data-role="rownote"></span>
    </div>
    <div class="charts">
      <div class="panel">
        <h3>Start time</h3>
        <div class="caption">P(start time | building type)</div>
        <svg data-role="start"></svg>
        <div class="stats" data-role="startStats"></div>
      </div>
      <div class="panel">
        <h3>End time</h3>
        <div class="caption" data-role="endCaption"></div>
        <svg data-role="end"></svg>
        <div class="stats" data-role="endStats"></div>
      </div>
    </div>`;
  rowsEl.appendChild(section);
  state.rows[dayType] = {
    hover: null,
    pinned: null,
    section,
    color,
    startSvg: section.querySelector('[data-role=start]'),
    endSvg: section.querySelector('[data-role=end]'),
    startStats: section.querySelector('[data-role=startStats]'),
    endStats: section.querySelector('[data-role=endStats]'),
    endCaption: section.querySelector('[data-role=endCaption]'),
    note: section.querySelector('[data-role=rownote]'),
  };
  section.addEventListener('mouseenter', () => { state.activeRow = dayType; });
}

const statLine = (parts) => parts.map(([k, v]) => `${k} <b>${v}</b>`).join('');

function renderRow(dayTypeName) {
  const dt = DATA.day_types[dayTypeName];
  const row = state.rows[dayTypeName];
  const bt = state.btIdx;
  const startPmf = dt.start_pmf[bt];
  const { grid: eGrid } = endGrid(dt);

  const selected = row.pinned != null ? row.pinned : row.hover;

  // Start-time chart domain: bins that actually carry probability.
  const sSupport = support([startPmf]);
  const sStep = dt.start_times.length > 1 ? key(dt.start_times[1] - dt.start_times[0]) : 0.25;
  const sDomain = sSupport
    ? [dt.start_times[sSupport[0]] - sStep * 2, dt.start_times[sSupport[1]] + sStep * 2]
    : [dt.start_times[0], dt.start_times[dt.start_times.length - 1]];

  drawChart(row.startSvg, {
    values: dt.start_times,
    weights: startPmf,
    domain: sDomain,
    step: sStep,
    accent: row.color,
    xTitle: 'start time (hour of day)',
    bandwidth: state.bandwidth,
    showKde: state.showKde,
    highlightIndex: selected,
    pinned: row.pinned != null,
    onHover: (idx, isClick) => {
      if (isClick) {
        row.pinned = (row.pinned === idx) ? null : idx;
      } else if (row.pinned == null) {
        if (row.hover === idx) return;
        row.hover = idx;
      } else {
        return;
      }
      state.activeRow = dayTypeName;
      renderRow(dayTypeName);
    },
  });

  const sStats = stats(dt.start_times, startPmf);
  row.startStats.innerHTML = sStats ? statLine([
    ['mean', fmtHour(sStats.mean)],
    ['median', fmtHour(sStats.p50)],
    ['p10–p90', `${fmtHour(sStats.p10)} – ${fmtHour(sStats.p90)}`],
  ]) : 'no data';

  // End-time chart: total mixture, or the conditional for the selected start time.
  const { weights: total, dropped } = endPmfTotal(dt, bt);
  let conditional = selected != null ? endPmfForStart(dt, bt, selected) : null;
  const selectedIsGap = conditional != null && sum(conditional) <= 0;
  if (selectedIsGap) conditional = null;
  const eStep = eGrid.length > 1 ? key(eGrid[1] - eGrid[0]) : 0.25;
  const eSupport = support([total, conditional].filter(Boolean));
  const eDomain = eSupport
    ? [eGrid[eSupport[0]] - eStep * 2, eGrid[eSupport[1]] + eStep * 2]
    : [eGrid[0], eGrid[eGrid.length - 1]];

  drawChart(row.endSvg, {
    values: eGrid,
    weights: selectedIsGap ? null : (conditional || total),
    ghost: conditional ? total : null,
    domain: eDomain,
    step: eStep,
    accent: row.color,
    xTitle: 'end time (hour of day)',
    bandwidth: state.bandwidth,
    showKde: state.showKde,
    emptyMessage: selectedIsGap
      ? `No duration distribution in the source TSV for a ${fmtHour(dt.start_times[selected])} start`
      : null,
  });

  const eStats = selectedIsGap ? null : stats(eGrid, conditional || total);
  const durPmf = conditional ? dt.dur_pmf[bt][selected] : durationPmfTotal(dt, bt);
  const dStats = selectedIsGap ? null : stats(dt.durations, durPmf);
  row.endStats.innerHTML = eStats ? statLine([
    ['mean', fmtHour(eStats.mean)],
    ['median', fmtHour(eStats.p50)],
    ['p10–p90', `${fmtHour(eStats.p10)} – ${fmtHour(eStats.p90)}`],
    ['mean duration', dStats ? fmtHours(dStats.mean) : '—'],
  ]) : '—';

  if (selected != null) {
    row.endCaption.innerHTML = selectedIsGap
      ? `Start time <b>${fmtHour(dt.start_times[selected])}</b> has no duration data`
      : `P(end time | start = <b>${fmtHour(dt.start_times[selected])}</b>) &middot; ` +
        `dashed outline = all start times`;
    row.note.textContent =
      `${fmtPct(startPmf[selected])} of ${titleCase(DATA.building_types[bt])} start at ` +
      `${fmtHour(dt.start_times[selected])}`;
  } else {
    row.endCaption.textContent = 'P(end time | building type), weighted over all start times';
    row.note.textContent = dropped > 1e-9
      ? `note: ${fmtPct(dropped)} of start times have no duration data and are excluded from the ` +
        `end-time distribution`
      : '';
  }
}

function renderAll() {
  for (const dayType of Object.keys(DATA.day_types)) renderRow(dayType);
}

/* ----------------------------------------------------------------- wiring */
btSelect.addEventListener('change', () => {
  state.btIdx = +btSelect.value;
  for (const row of Object.values(state.rows)) { row.hover = null; row.pinned = null; }
  renderAll();
});
const bwInput = document.getElementById('bw');
bwInput.addEventListener('input', () => {
  state.bandwidth = +bwInput.value;
  document.getElementById('bwVal').textContent = state.bandwidth.toFixed(2) + ' h';
  renderAll();
});
document.getElementById('kdeOn').addEventListener('change', (e) => {
  state.showKde = e.target.checked;
  renderAll();
});
document.addEventListener('keydown', (e) => {
  const dayTypeName = state.activeRow || Object.keys(DATA.day_types)[0];
  const row = state.rows[dayTypeName];
  const dt = DATA.day_types[dayTypeName];
  if (e.key === 'Escape') {
    row.pinned = null; row.hover = null; renderRow(dayTypeName); return;
  }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const startPmf = dt.start_pmf[state.btIdx];
  const active = startPmf.map((p, i) => (p > 0 ? i : -1)).filter((i) => i >= 0);
  if (!active.length) return;
  const current = row.pinned != null ? row.pinned : row.hover;
  let pos = active.indexOf(current);
  if (pos < 0) pos = e.key === 'ArrowRight' ? -1 : active.length;
  pos = Math.min(Math.max(pos + (e.key === 'ArrowRight' ? 1 : -1), 0), active.length - 1);
  row.pinned = active[pos];
  row.hover = null;
  e.preventDefault();
  renderRow(dayTypeName);
});

renderAll();
</script>
</body>
</html>
