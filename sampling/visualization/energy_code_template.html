<script>
const DATA = __DATA__;

/* ------------------------------------------------------------------ helpers */
const SVG_NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent = null) => {
  const n = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
};
const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };
const titleCase = (s) => s.replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
const pct = (p) => p <= 0 ? '0%' : p < 0.001 ? '<0.1%' : (p * 100).toFixed(1) + '%';

/* ------------------------------------------------------- colour ramps (OKLCH)
 * Hue carries the code family, lightness carries the vintage within it. Every ramp
 * below passes the ordinal checks in scripts/validate_palette.js (monotone lightness,
 * adjacent OKLCH dL >= 0.06, light end clear of the surface) in both modes.
 */
const srgb = (x) => x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055;
function oklchToRgb(L, C, Hdeg) {
  const h = Hdeg * Math.PI / 180, a = C * Math.cos(h), b = C * Math.sin(h);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
  return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
          -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
          -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
}
function oklchToHex(L, C, H) {
  let c = C;
  for (let i = 0; i < 60; i++) {
    if (oklchToRgb(L, c, H).every((v) => v >= -1e-4 && v <= 1 + 1e-4)) break;
    c *= 0.95;
  }
  const rgb = oklchToRgb(L, c, H).map((v) => Math.round(Math.min(1, Math.max(0, srgb(v))) * 255));
  return '#' + rgb.map((v) => v.toString(16).padStart(2, '0')).join('');
}
const rampHex = (n, [L0, L1], C, H) =>
  Array.from({ length: n }, (_, i) => oklchToHex(n === 1 ? L0 : L0 + (L1 - L0) * i / (n - 1), C, H));

const FAMILIES = [
  { key: 'doe_ref',  label: 'DOE reference vintages', H: 250, C: 0.025,
    light: [0.74, 0.55], dark: [0.86, 0.66], test: (c) => /DOE Ref/i.test(c) },
  { key: 'ashrae',   label: 'ASHRAE 90.1', H: 257, C: 0.14,
    light: [0.755, 0.40], dark: [0.88, 0.50], test: (c) => /90\.1/.test(c) },
  { key: 'deer_old', label: 'DEER, pre-2003', H: 350, C: 0.13,
    light: [0.73, 0.53], dark: [0.86, 0.62],
    test: (c) => /DEER/i.test(c) && deerYear(c) < 2003 },
  { key: 'deer_new', label: 'DEER, 2003 and later', H: 55, C: 0.14,
    light: [0.78, 0.36], dark: [0.90, 0.50],
    test: (c) => /DEER/i.test(c) && deerYear(c) >= 2003 },
  { key: 'other',    label: 'Other', H: 150, C: 0.11,
    light: [0.75, 0.42], dark: [0.86, 0.52], test: () => true },
];
function deerYear(code) {
  const m = code.match(/(\d{4})/);
  return m ? +m[1] : 0;
}
const darkMode = () => matchMedia('(prefers-color-scheme: dark)').matches
                       && document.documentElement.dataset.theme !== 'light';

let COLOR = [], FAMILY_OF = [];
function buildColors() {
  const mode = darkMode() ? 'dark' : 'light';
  FAMILY_OF = DATA.codes.map((c) => FAMILIES.find((f) => f.test(c)).key);
  COLOR = new Array(DATA.codes.length);
  for (const fam of FAMILIES) {
    const members = DATA.codes.map((_, i) => i).filter((i) => FAMILY_OF[i] === fam.key);
    if (!members.length) continue;
    const hexes = rampHex(members.length, fam[mode], fam.C, fam.H);
    members.forEach((codeIx, k) => { COLOR[codeIx] = hexes[k]; });
  }
}
const displayCode = (c) => c.replace(/^ComStock\s+/, '');

/* ------------------------------------------------- sparse P(code | state, bin) */
const nS = DATA.states.length, nB = DATA.bins.length, nC = DATA.codes.length,
      nY = DATA.years.length, nT = DATA.building_types.length;
// SPARSE[state][bin] = [codeIndex, probability, ...]; typically one entry per row.
const SPARSE = DATA.p_code.map((byBin) => byBin.map((row) => {
  const out = [];
  for (let c = 0; c < row.length; c++) if (row[c] > 0) out.push(c, row[c]);
  return out;
}));

/* ---------------------------------------------------------------- app state */
const ALL = 'all';
const state = {
  bt: ALL, st: ALL, mode: 'within', weighting: 'count', allYears: false, showTable: false,
  focusYear: null, hoverCode: null,
  sel: null,   // computed selection, see computeSelection()
};

// Every share on the page is measured in whichever unit the weighting toggle selects.
const byArea = () => state.weighting === 'area';
const unitNoun = () => byArea() ? 'floor area' : 'buildings';

/**
 * Aggregate the selection into per-year code shares.
 *
 * W[state][year] is the joint stock weight of the selection. The code distribution for a
 * construction year is the state-weighted mixture of P(code | state, year), which in turn
 * composes the two source TSVs: sum_bin P(bin | year) * P(code | state, bin).
 */
function computeSelection() {
  const bts = state.bt === ALL ? DATA.building_types.map((_, i) => i) : [+state.bt];
  const sts = state.st === ALL ? DATA.states.map((_, i) => i) : [+state.st];

  // Floor-area weighting multiplies each cell by its expected building area; the conditional
  // P(code | state, year) is untouched, only the weight behind each year changes.
  const MASS = byArea() ? DATA.mass_area : DATA.mass;
  const YPMF = byArea() ? DATA.year_pmf_area : DATA.year_pmf;

  const W = new Float64Array(nS * nY);
  let totalW = 0;
  for (const b of bts) {
    const massRow = MASS[b], pmfRow = YPMF[b];
    for (const s of sts) {
      const m = massRow[s];
      if (m <= 0) continue;
      const pmf = pmfRow[s], base = s * nY;
      for (let y = 0; y < nY; y++) {
        const w = m * pmf[y];
        if (w > 0) { W[base + y] += w; totalW += w; }
      }
    }
  }

  const perYear = new Float64Array(nY * nC);   // joint weight of (year, code)
  const yearW = new Float64Array(nY);
  if (totalW > 0) {
    for (const s of sts) {
      const sparse = SPARSE[s], base = s * nY;
      for (let y = 0; y < nY; y++) {
        const w = W[base + y] / totalW;
        if (w <= 0) continue;
        yearW[y] += w;
        const pb = DATA.p_bin[y], rowBase = y * nC;
        for (let b = 0; b < nB; b++) {
          const pbv = pb[b];
          if (pbv <= 0) continue;
          const entries = sparse[b], wb = w * pbv;
          for (let k = 0; k < entries.length; k += 2) perYear[rowBase + entries[k]] += wb * entries[k + 1];
        }
      }
    }
  }

  const totals = new Float64Array(nC);
  for (let y = 0; y < nY; y++) for (let c = 0; c < nC; c++) totals[c] += perYear[y * nC + c];

  // Default x-domain trims construction years holding less than 0.5% of the selection.
  let lo = 0, hi = nY - 1, acc = 0;
  while (lo < nY && acc + yearW[lo] < 0.005) acc += yearW[lo++];
  while (hi > lo && yearW[hi] <= 0) hi--;
  const trimmedWeight = acc;

  state.sel = { perYear, yearW, totals, lo, hi, trimmedWeight, nStates: sts.length };
}

/* ------------------------------------------------------------ main chart */
const W_SVG = 1000, M = { t: 12, r: 12, b: 34, l: 48 };
const PLOT_H = 330, STRIP_H = 44, STRIP_GAP = 30;

function drawMain() {
  const svg = document.getElementById('main');
  const { perYear, yearW, lo, hi, trimmedWeight } = state.sel;
  const showStrip = state.mode === 'within';
  const stripBlock = showStrip ? STRIP_GAP + STRIP_H : 0;
  const H = M.t + PLOT_H + stripBlock + M.b;
  clear(svg);
  svg.setAttribute('viewBox', `0 0 ${W_SVG} ${H}`);

  const first = state.allYears ? 0 : lo, last = hi;
  const count = last - first + 1;
  const plotW = W_SVG - M.l - M.r;
  const colW = plotW / count;
  // A surface gap between columns only reads as separation when the bars are wide enough to
  // spare it; below that it turns the chart into a barcode, so the columns stay contiguous.
  const barW = colW >= 9 ? colW - 1 : colW;
  const xOf = (i) => M.l + (i - first) * colW;

  const yMax = state.mode === 'within' ? 1
    : Math.max(1e-9, Math.max(...Array.from({ length: count }, (_, k) => yearW[first + k])) * 1.08);
  const yOf = (v) => M.t + PLOT_H - (v / yMax) * PLOT_H;

  const gAxis = el('g', { class: 'axis' }, svg);
  const yStep = state.mode === 'within' ? 0.25 : niceStep(yMax);
  for (let v = 0; v <= yMax + 1e-9; v += yStep) {
    el('line', { x1: M.l, x2: M.l + plotW, y1: yOf(v), y2: yOf(v), class: 'gridline' }, gAxis);
    el('text', { x: M.l - 8, y: yOf(v) + 3.5, 'text-anchor': 'end' }, gAxis)
      .textContent = (v * 100).toFixed(v > 0 && v < 0.01 ? 1 : 0) + '%';
  }

  // stacked segments, oldest code family at the bottom
  const gBars = el('g', {}, svg);
  for (let k = 0; k < count; k++) {
    const y = first + k;
    const scale = state.mode === 'within'
      ? (yearW[y] > 0 ? 1 / yearW[y] : 0)   // renormalize the year to 100%
      : 1;
    let acc = 0;
    for (let c = 0; c < nC; c++) {
      const v = perYear[y * nC + c] * scale;
      if (v <= 0) continue;
      const y0 = yOf(acc), y1 = yOf(acc + v);
      acc += v;
      let h = y0 - y1;
      // A 1px gap separates segments tall enough to spare it; thin ones stay contiguous
      // rather than being erased by their own separator.
      if (h > 6) h -= 1;
      el('rect', {
        x: xOf(y), y: y1, width: barW, height: Math.max(0.6, h),
        fill: COLOR[c], class: 'seg-rect',
        opacity: state.hoverCode == null || state.hoverCode === c ? 1 : 0.18,
      }, gBars);
    }
  }

  el('text', { x: -(M.t + PLOT_H / 2), y: 12, transform: 'rotate(-90)', 'text-anchor': 'middle',
               class: 'axis-title' }, svg)
    .textContent = state.mode === 'within'
      ? `share of that year’s ${unitNoun()}` : `share of selected ${unitNoun()}`;

  // construction-year weight strip
  if (showStrip) {
    const top = M.t + PLOT_H + STRIP_GAP;
    let wMax = 0;
    for (let k = 0; k < count; k++) wMax = Math.max(wMax, yearW[first + k]);
    const g = el('g', {}, svg);
    el('line', { x1: M.l, x2: M.l + plotW, y1: top + STRIP_H, y2: top + STRIP_H, class: 'gridline' }, g);
    for (let k = 0; k < count; k++) {
      const v = yearW[first + k];
      if (v <= 0) continue;
      const h = Math.max(0.6, (v / (wMax || 1)) * STRIP_H);
      el('rect', { x: xOf(first + k), y: top + STRIP_H - h, width: barW, height: h,
                   class: 'strip-rect' }, g);
    }
    el('text', { x: M.l, y: top - 9, class: 'axis-title' }, svg)
      .textContent = `share of selected ${unitNoun()} built in each year`;
  }

  // x axis
  const axisY = M.t + PLOT_H + stripBlock;
  const span = DATA.years[last] - DATA.years[first];
  const tickStep = span > 150 ? 25 : span > 60 ? 20 : span > 30 ? 10 : 5;
  const g2 = el('g', { class: 'axis' }, svg);
  for (let k = 0; k < count; k++) {
    const yr = DATA.years[first + k];
    if (yr % tickStep) continue;
    const x = xOf(first + k) + barW / 2;
    el('line', { x1: x, x2: x, y1: axisY, y2: axisY + 4, class: 'gridline' }, g2);
    el('text', { x, y: axisY + 16, 'text-anchor': 'middle' }, g2).textContent = yr;
  }
  el('text', { x: M.l + plotW / 2, y: axisY + 30, 'text-anchor': 'middle', class: 'axis-title' }, svg)
    .textContent = 'year of original building construction';

  // cursor + hover layer (nearest column, so the hit area is the whole plot)
  if (state.focusYear != null && state.focusYear >= first && state.focusYear <= last) {
    const x = xOf(state.focusYear) + barW / 2;
    el('line', { x1: x, x2: x, y1: M.t, y2: axisY, class: 'cursor-line' }, svg);
  }
  const hit = el('rect', { x: M.l, y: M.t, width: plotW, height: PLOT_H + stripBlock,
                           class: 'hitbox' }, svg);
  const yearFromEvent = (evt) => {
    const box = svg.getBoundingClientRect();
    const vx = ((evt.clientX - box.left) / box.width) * W_SVG;
    const k = Math.floor((vx - M.l) / colW);
    return Math.min(last, Math.max(first, first + k));
  };
  hit.addEventListener('mousemove', (e) => {
    const y = yearFromEvent(e);
    if (y !== state.focusYear) { state.focusYear = y; drawMain(); }
    showTip(e.clientX, e.clientY);
  });
  hit.addEventListener('mouseleave', () => { state.focusYear = null; hideTip(); drawMain(); });

  document.getElementById('mainNote').textContent = state.allYears || trimmedWeight <= 0
    ? ''
    : `Years before ${DATA.years[lo]} hold ${pct(trimmedWeight)} of the selection and are hidden.`;
}

function niceStep(max) {
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * mag) return m * mag;
  return 10 * mag;
}

/* ---------------------------------------------------------------- tooltip */
let tipEl = null;
function showTip(cx, cy) {
  const y = state.focusYear;
  if (y == null) return hideTip();
  const { perYear, yearW } = state.sel;
  const rows = [];
  for (let c = 0; c < nC; c++) {
    const v = perYear[y * nC + c];
    if (v > 0) rows.push([c, yearW[y] > 0 ? v / yearW[y] : 0]);
  }
  rows.sort((a, b) => b[1] - a[1]);
  if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl); }
  tipEl.innerHTML =
    `<h4>Built ${DATA.years[y]}</h4>` +
    `<div class="meta">${pct(yearW[y])} of the selected ${unitNoun()}</div>` +
    rows.slice(0, 8).map(([c, share]) =>
      `<div class="tip-row"><span class="swatch" style="background:${COLOR[c]}"></span>` +
      `<span>${displayCode(DATA.codes[c])}</span><span class="v">${pct(share)}</span></div>`).join('') +
    (rows.length > 8 ? `<div class="tip-row"><span></span><span>+${rows.length - 8} more</span><span></span></div>` : '');
  tipEl.hidden = false;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.min(cx + 14, innerWidth - w - 8) + 'px';
  tipEl.style.top = Math.min(Math.max(8, cy - h / 2), innerHeight - h - 8) + 'px';
}
function hideTip() { if (tipEl) tipEl.hidden = true; }

/* ------------------------------------------------------- summary + table */
// Rows are rebuilt only when the selection changes. Rebuilding them on hover would destroy
// the element under the cursor, so its mouseleave would never fire and the isolate would stick.
let summaryRows = [];
function drawSummary() {
  const host = document.getElementById('summary');
  clear(host);
  summaryRows = [];
  const { totals } = state.sel;
  const max = Math.max(...totals, 1e-9);

  for (const fam of FAMILIES) {
    const members = DATA.codes.map((_, i) => i)
      .filter((i) => FAMILY_OF[i] === fam.key && totals[i] > 0);
    if (!members.length) continue;
    const head = document.createElement('div');
    head.className = 'family-head';
    head.textContent = fam.label;
    host.appendChild(head);
    for (const c of members) {
      const row = document.createElement('div');
      row.className = 'code-row';
      row.innerHTML =
        `<span class="swatch" style="background:${COLOR[c]}"></span>` +
        `<span class="code-name">${displayCode(DATA.codes[c])}</span>` +
        `<span class="code-bar"><div style="width:${(totals[c] / max * 100).toFixed(2)}%;` +
        `background:${COLOR[c]}"></div></span>` +
        `<span class="code-val">${pct(totals[c])}</span>`;
      row.addEventListener('mouseenter', () => setHoverCode(c));
      host.appendChild(row);
      summaryRows.push({ row, code: c });
    }
  }
  if (!summaryRows.length) host.textContent = 'Nothing in this selection.';
  applyHover();
}

function setHoverCode(c) {
  if (state.hoverCode === c) return;
  state.hoverCode = c;
  applyHover();
  drawMain();
}

function applyHover() {
  for (const { row, code } of summaryRows) {
    row.classList.toggle('dim', state.hoverCode != null && state.hoverCode !== code);
    row.classList.toggle('active', state.hoverCode === code);
  }
}

function drawTable() {
  const wrap = document.getElementById('tableWrap');
  wrap.hidden = !state.showTable;
  if (!state.showTable) return;
  const { totals } = state.sel;
  const rows = DATA.codes.map((c, i) => [c, i]).filter(([, i]) => totals[i] > 0);
  const unitCol = byArea() ? 'Share of floor area' : 'Share of buildings';
  wrap.innerHTML =
    `<table><caption>By code version, current selection, weighted by ${unitNoun()}</caption>` +
    `<thead><tr><th>Code version</th><th>Family</th><th class="num">${unitCol}</th></tr></thead><tbody>` +
    rows.map(([c, i]) =>
      `<tr><td>${displayCode(c)}</td>` +
      `<td>${FAMILIES.find((f) => f.key === FAMILY_OF[i]).label}</td>` +
      `<td class="num">${(totals[i] * 100).toFixed(2)}%</td></tr>`).join('') +
    '</tbody></table>';
}

/* ----------------------------------------------------------------- render */
function scopeText() {
  const bt = state.bt === ALL ? 'all building types' : titleCase(DATA.building_types[state.bt]);
  const st = state.st === ALL ? 'all states' : DATA.state_names[state.st];
  const parts = [`Showing ${bt} in ${st}, weighted by ${byArea() ? 'floor area' : 'building count'}.`];
  if (state.st !== ALL) {
    parts.push('The source TSVs condition the code only on state and replacement year, so with a '
      + 'single state selected the building type and the weighting change how much stock sits '
      + 'behind each construction year — and the summary below — but not the shares within a year.');
  } else {
    parts.push('With all states pooled, the building type and the weighting shift the state '
      + 'mixture, so they move the within-year shares as well.');
  }
  return parts.join(' ');
}

function render() {
  computeSelection();
  document.getElementById('mainTitle').textContent =
    'Energy code version in force at the last HVAC replacement, by year of construction';
  document.getElementById('scopeNote').textContent = scopeText();
  document.getElementById('summaryNote').textContent =
    (byArea() ? 'Construction years weighted by how much of the selected floor area was built '
              : 'Construction years weighted by how many of the selected buildings were built ') +
    'in each year. Rows double as the chart legend — hover one to isolate it above.';
  drawMain();
  drawSummary();
  drawTable();
}

/* ----------------------------------------------------------------- wiring */
const btSel = document.getElementById('bt');
const stSel = document.getElementById('state');
const addOpt = (sel, value, label) => {
  const o = document.createElement('option');
  o.value = value; o.textContent = label; sel.appendChild(o);
};
addOpt(btSel, ALL, 'All building types');
DATA.building_types.forEach((bt, i) => addOpt(btSel, i, titleCase(bt)));
addOpt(stSel, ALL, 'All states');
DATA.state_names.map((n, i) => [n, i]).sort((a, b) => a[0].localeCompare(b[0]))
  .forEach(([n, i]) => addOpt(stSel, i, n));

btSel.addEventListener('change', () => { state.bt = btSel.value; render(); });
stSel.addEventListener('change', () => { state.st = stSel.value; render(); });
document.getElementById('summary').addEventListener('mouseleave', () => setHoverCode(null));
document.getElementById('mode').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  state.mode = btn.dataset.mode;
  for (const b of e.currentTarget.querySelectorAll('button'))
    b.setAttribute('aria-pressed', String(b === btn));
  drawMain();
});
document.getElementById('weighting').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-weight]');
  if (!btn || btn.dataset.weight === state.weighting) return;
  state.weighting = btn.dataset.weight;
  for (const b of e.currentTarget.querySelectorAll('button'))
    b.setAttribute('aria-pressed', String(b === btn));
  render();
});
document.getElementById('allYears').addEventListener('change', (e) => {
  state.allYears = e.target.checked; drawMain();
});
document.getElementById('showTable').addEventListener('change', (e) => {
  state.showTable = e.target.checked; drawTable();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { state.focusYear = null; hideTip(); drawMain(); return; }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const { lo, hi } = state.sel;
  const first = state.allYears ? 0 : lo;
  const cur = state.focusYear == null ? first : state.focusYear;
  state.focusYear = Math.min(hi, Math.max(first, cur + (e.key === 'ArrowRight' ? 1 : -1)));
  e.preventDefault();
  drawMain();
  const box = document.getElementById('main').getBoundingClientRect();
  showTip(box.left + box.width / 2, box.top + 40);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  buildColors(); drawMain(); drawSummary();
});

document.getElementById('subtitle').innerHTML =
  `<code>energy_code_in_force_during_last_hvac_replacement</code> depends on state and ` +
  `<code>year_bin_of_last_hvac_replacement</code>, which depends on the simulation year and ` +
  `<code>year_built</code>. Composing them gives P(code | state, construction year). Stock ` +
  `weights come from the sampler's own chain of region, building type, size bin, tract and ` +
  `year built. Weighting by floor area multiplies each of those cells by its expected building ` +
  `area, from <code>building_area</code> and the <code>total_bldg_floor_area</code> values in ` +
  `<code>options_lookup.tsv</code>. Source <code>${DATA.source}</code>, generated ${DATA.generated}.`;

buildColors();
render();
</script>
</body>
</html>
